name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy-dashboard:
    name: Deploy Dashboard to minitracker.pages.dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Dashboard
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages (minitracker)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name minitracker --branch main

  deploy-website:
    name: Deploy Website to get-hike.pages.dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Website
        run: |
          cd website
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages (get-hike)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website/dist --project-name get-hike --branch main
